services:
  rainflow:
    build: .
    image: rainflow-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # SQLite lives on the mounted volume so jobs survive container
      # restarts and re-creations.
      DB_PATH: /data/rainflow.db
    volumes:
      - rainflow-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  rainflow-data:
